name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Revisar que se subieron todos los archivos
        run: |
          echo "Archivos en el repositorio:"
          find . -path ./.git -prune -o -type f -print | sort
          faltan=0
          for f in app/build.gradle.kts app/src/main/AndroidManifest.xml \
                   app/src/main/java/app/njsmusic/MainActivity.kt \
                   app/src/main/java/app/njsmusic/LightStick.kt \
                   app/src/main/java/app/njsmusic/MusicService.kt \
                   app/src/main/java/app/njsmusic/MusicAnalyzer.kt; do
            if [ ! -f "$f" ]; then echo "FALTA: $f"; faltan=1; fi
          done
          if [ "$faltan" = "1" ]; then
            echo "Sube la carpeta 'app' completa (con todo su contenido) al repositorio."
            exit 1
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        run: gradle assembleDebug --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: NJ-LightStick-Music-APK
          path: app/build/outputs/apk/debug/*.apk
