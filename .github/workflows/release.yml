name: Publicar versión

# Se ejecuta a mano: Actions → "Publicar versión" → Run workflow → escribe la versión (ej. 1.0.0)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión X.Y.Z (ej. 1.0.0, 1.0.1, 1.1.0, 2.0.0)"
        required: true
        default: "1.0.0"
      notes:
        description: "Novedades (opcional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Revisar la version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "La versión debe tener el formato X.Y.Z con números (ej. 1.0.0). Escribiste: $VERSION"
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "$VERSION"
          # código interno: 1.0.0 -> 10000, 1.2.3 -> 10203 (siempre sube si subes la versión)
          CODE=$(( 10#$MA * 10000 + 10#$MI * 100 + 10#$PA ))
          echo "REUP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "REUP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versión $VERSION (código $CODE)"

      - name: Revisar la llave de firma
        env:
          KS: ${{ secrets.REUP_KEYSTORE_BASE64 }}
          PW: ${{ secrets.REUP_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "Faltan los secretos REUP_KEYSTORE_BASE64 y/o REUP_KEYSTORE_PASSWORD."
            echo "Crea tu llave con herramientas/crear_llave.py y agrégalos en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/reup-release.p12"
          echo "REUP_KEYSTORE=$RUNNER_TEMP/reup-release.p12" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK firmado
        env:
          REUP_KEYSTORE_PASSWORD: ${{ secrets.REUP_KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/RE-UP-Lightstick-v${REUP_VERSION_NAME}.apk"
          rm -f "$RUNNER_TEMP/reup-release.p12"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.REUP_VERSION_NAME }}
          name: RE UP! Lightstick v${{ env.REUP_VERSION_NAME }}
          body: |
            ${{ inputs.notes }}

            **Descarga:** el archivo `.apk` de abajo. Ábrelo en tu celular Android (8.0 o superior) y permite "instalar apps desconocidas".
            App no oficial, hecha por fans. Sin relación con ADOR ni HYBE.
          files: dist/*.apk
